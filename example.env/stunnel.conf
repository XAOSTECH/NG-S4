# A commercial or separate licence is available on request from the owner.
#
# The transcode engine pushes plain RTMP to the local accept ports below and
# stunnel forwards it over TLS to each platform. Keep the accept ports in step
# with YT_STUNNEL_PORT / KI_STUNNEL_PORT in master.env.

setuid = stunnel4
setgid = stunnel4
pid = /var/run/stunnel/stunnel.pid
output = /var/log/stunnel4/stunnel.log
cert = /etc/stunnel/stunnel.pem
client = yes
debug = info
TIMEOUTclose = 0

# YouTube (HDR capable, HEVC over enhanced RTMP is accepted here).
[youtube_rtmps]
accept = 127.0.0.1:19351
connect = a.rtmps.youtube.com:443

# Kick. Replace the host with the ingest shown in your Kick dashboard.
[kick_rtmps]
accept = 127.0.0.1:19352
connect = xxNNNxxNxNNN.global-contribute.live-video.net:443

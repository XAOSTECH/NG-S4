#
# Stunnel is protocol-agnostic: it wraps any TCP stream in TLS. The entries
# below cover RTMP (Kick) and optionally HLS over HTTP (YouTube) and RTMPS
# (Twitch). For HLS via stunnel, also set YT_STUNNEL_PORT in master.env.

setuid = stunnel4
setgid = stunnel4
pid = /var/run/stunnel/stunnel.pid
output = /var/log/stunnel4/stunnel.log
cert = /etc/stunnel/stunnel.pem
client = yes
debug = info
TIMEOUTclose = 0

# Kick: RTMP in, RTMPS out (always active when Kick is enabled).
[kick_rtmps]
accept = 127.0.0.1:19352
connect = xxNNNxxNxNNN.global-contribute.live-video.net:443

# YouTube HLS (optional): plain HTTP in, HTTPS out. Enable by uncommenting and
# setting YT_STUNNEL_PORT="19351" in master.env.
;[youtube_hls]
;accept = 127.0.0.1:19351
;connect = a.upload.youtube.com:443

# Twitch RTMPS (optional): enables encrypted ingest. Enable by uncommenting,
# setting TW_URL="rtmp://127.0.0.1:19350/app" in master.env, and ensuring the
# correct ingest server is used.
;[twitch_rtmps]
;accept = 127.0.0.1:19350
;connect = lhr.contribute.live-video.net:443

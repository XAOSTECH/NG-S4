#
# Tokens written as @@NAME@@ are substituted by UNIX-Scripts/setup-restream.sh
# from real.env/master.env, so this single file adapts to any host and LAN.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

# Unix socket directory used by the RTMP module for local relays.
rtmp_socket_dir /var/sock;

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Only localhost and the LAN may publish or play.
        allow publish 127.0.0.1;
        allow publish ::1;
        allow publish @@LAN_CIDR@@;
        deny publish all;

        allow play 127.0.0.1;
        allow play ::1;
        allow play @@LAN_CIDR@@;
        deny play all;

        # Master ingest. Publish here from OBS or a camera, for example:
        #   rtmp://<host>:1935/ingest/live
        # On publish, the transcode engine fans the feed out to every enabled
        # platform defined in real.env/master.env (Twitch, YouTube, Kick, ...).
        # For a 4K HDR (HEVC 10 bit) master, ingest over SRT instead and run the
        # engine standalone, because the RTMP module carries H.264/AAC only.
        application ingest {
            live on;
            record off;

            # Low latency LAN preview as HLS.
            hls on;
            hls_path @@HLS_BASE_DIR@@/ingest;
            hls_fragment 2s;
            hls_playlist_length 12s;
            hls_nested on;

            # Fan-out re-encode (see the *_ target profiles in master.env).
            # Use SIGTERM so the engine can stop its ffmpeg children cleanly when
            # the publisher disconnects (the default SIGKILL would orphan them).
            exec_kill_signal term;
            exec /usr/local/bin/ng-s4-transcode.sh $name;
        }
    }
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    gzip on;
    keepalive_timeout 65;

    server {
        listen @@HTTP_PORT@@;

        location / {
            root /var/www/html;
            index index.html index.htm;
        }

        # HLS preview playback (CORS enabled for in-browser players).
        location /hls {
            alias @@HLS_BASE_DIR@@;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;
            add_header Access-Control-Allow-Headers 'Range' always;
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin '*' always;
                add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Range' always;
                add_header Content-Length 0;
                return 204;
            }
        }

        # RTMP statistics (XML rendered with the module stylesheet).
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location = /stat.xsl {
            root /var/www/html;
        }

        # Simple health endpoint for LAN checks and monitors.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}

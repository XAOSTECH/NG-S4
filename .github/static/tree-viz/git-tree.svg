<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="820" 
     viewBox="0 0 1200 820">
  <defs>
    <radialGradient id="leafGradient">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="mergeGradient">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="forkGradient">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="tagGradient">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.8" />
    </radialGradient>
    <style>
      .branch-line { stroke: #64748b; stroke-width: 2; fill: none; opacity: 0.7; }
      .trunk-line { stroke: #22c55e; stroke-width: 2.5; fill: none; opacity: 0.6; }
      .commit-leaf { cursor: pointer; }
      .commit-leaf:hover { filter: brightness(1.5); }
      .branch-label { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>
  
  <rect width="1200" height="820" fill="#f8fafc"/>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="820" fill="url(#grid)"/>
  
  <!-- Branch connection lines -->
  <g id="branches">
    <line class="trunk-line" x1="600" y1="60" x2="600" y2="180"/>
    <path class="branch-line" d="M 600 60 C 600 76, 720 84, 720 100"/>
    <path class="branch-line" d="M 720 100 C 720 132, 600 148, 600 180"/>
    <line class="trunk-line" x1="600" y1="180" x2="600" y2="300"/>
    <path class="branch-line" d="M 480 220 C 480 252, 600 268, 600 300"/>
    <line class="trunk-line" x1="600" y1="300" x2="600" y2="420"/>
    <path class="branch-line" d="M 600 300 C 600 316, 840 324, 840 340"/>
    <path class="branch-line" d="M 840 340 C 840 372, 600 388, 600 420"/>
    <line class="trunk-line" x1="600" y1="420" x2="600" y2="460"/>
    <line class="trunk-line" x1="600" y1="460" x2="600" y2="500"/>
    <line class="trunk-line" x1="600" y1="500" x2="600" y2="620"/>
    <path class="branch-line" d="M 600 500 C 600 516, 360 524, 360 540"/>
    <path class="branch-line" d="M 360 540 C 360 572, 600 588, 600 620"/>
    <line class="trunk-line" x1="600" y1="620" x2="600" y2="660"/>
    <line class="trunk-line" x1="600" y1="660" x2="600" y2="700"/>
  </g>
  <!-- Commit nodes -->
  <g id="commits">
    <circle class="commit-leaf" cx="600" cy="60" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>326e109: Merge pull request #9 from XAOSTECH:humanise/20261115-101446</title></circle>
    <circle class="commit-leaf" cx="720" cy="100" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>276e170: chore: humanise hard-wrapped comments and prose</title></circle>
    <circle class="commit-leaf" cx="600" cy="180" r="9" fill="url(#forkGradient)" stroke="#ea580c" stroke-width="1.5"><title>2e7d058: chore(dc-init): update workflows,actions,docs</title></circle>
    <circle class="commit-leaf" cx="480" cy="220" r="6" fill="url(#tagGradient)" stroke="#0284c7" stroke-width="1.5"><title>c1a13d5: chore(dc-init): update workflows,actions,docs</title></circle>
    <circle class="commit-leaf" cx="600" cy="300" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>1ed563e: Merge pull request #7 from XAOSTECH/anglicise/20261101-054612</title></circle>
    <circle class="commit-leaf" cx="840" cy="340" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>c366289: chore: convert American spellings to British English</title></circle>
    <circle class="commit-leaf" cx="600" cy="420" r="9" fill="url(#forkGradient)" stroke="#ea580c" stroke-width="1.5"><title>4992c7c: test(run-tests): verify global bitrate cap applies to YouTube but not Twitch</title></circle>
    <g class="commit-leaf"><rect x="591" y="451" width="18" height="18" rx="3" transform="rotate(45 600 460)" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="464" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">27</text><title>27 commits</title></g>
    <circle class="commit-leaf" cx="600" cy="500" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>befc317: Merge pull request #6 from XAOSTECH/humanise/20261015-075319</title></circle>
    <circle class="commit-leaf" cx="360" cy="540" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>bc9af73: chore: humanise hard-wrapped comments and prose</title></circle>
    <circle class="commit-leaf" cx="600" cy="620" r="9" fill="url(#forkGradient)" stroke="#ea580c" stroke-width="1.5"><title>de3f5b9: chore(dc-init): update workflows,actions</title></circle>
    <g class="commit-leaf"><rect x="591" y="651" width="18" height="18" rx="3" transform="rotate(45 600 660)" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="664" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">29</text><title>29 commits</title></g>
    <circle class="commit-leaf" cx="600" cy="700" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>9b1b1a1: First base.</title></circle>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(20, 20)">
    <rect width="200" height="110" fill="white" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <circle cx="20" cy="25" r="5" fill="url(#leafGradient)" stroke="#16a34a"/>
    <text x="32" y="30" class="branch-label" font-size="12">Regular Commit</text>
    <circle cx="20" cy="50" r="6" fill="url(#mergeGradient)" stroke="#7c3aed"/>
    <text x="32" y="55" class="branch-label" font-size="12">Merge Commit</text>
    <circle cx="20" cy="75" r="6" fill="url(#forkGradient)" stroke="#ea580c"/>
    <text x="32" y="80" class="branch-label" font-size="12">Fork Point</text>
    <circle cx="20" cy="100" r="6" fill="url(#tagGradient)" stroke="#0284c7"/>
    <text x="32" y="105" class="branch-label" font-size="12">Tagged</text>
  </g>
  
  <!-- Repository info -->
  <g id="info" transform="translate(20, 780)">
    <text x="0" y="0" class="branch-label" font-size="12" fill="#666">
      Repository: NG-S4
    </text>
    <text x="0" y="20" class="branch-label" font-size="10" fill="#999">
      Generated: 2026-11-15 10:16:54 UTC
    </text>
  </g>
</svg>
